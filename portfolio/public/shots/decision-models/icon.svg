<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0d1c"/><stop offset="1" stop-color="#12060b"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#fb7185" stroke-opacity=".35" stroke-width="4"/>
  <!-- calibration frame: perfect honesty is the diagonal -->
  <path d="M120 392 L392 120" stroke="#fecdd3" stroke-opacity=".35" stroke-width="6" stroke-dasharray="14 14" stroke-linecap="round"/>
  <path d="M120 120 V392 H392" fill="none" stroke="#fecdd3" stroke-opacity=".55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- an honest model: points hugging the diagonal -->
  <polyline points="156,350 208,302 262,244 312,198 360,150" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="156" cy="350" r="15" fill="#fb7185"/>
  <circle cx="208" cy="302" r="17" fill="#fb7185"/>
  <circle cx="262" cy="244" r="20" fill="#fb7185"/>
  <circle cx="312" cy="198" r="17" fill="#fb7185"/>
  <circle cx="360" cy="150" r="22" fill="#fff1f2"/>
</svg>
