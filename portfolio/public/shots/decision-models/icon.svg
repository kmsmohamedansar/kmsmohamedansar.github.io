<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Original mark: an open isometric cube (a typed decision) with the
       calibration diagonal running through it (is the confidence honest?). -->
  <rect width="512" height="512" rx="112" fill="#e845b8"/>
  <g fill="none" stroke="#141014" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <!-- outer cube silhouette -->
    <path d="M256 96 L395 176 L395 336 L256 416 L117 336 L117 176 Z"/>
    <!-- inner edges meeting at the front corner -->
    <path d="M117 176 L256 256 L395 176"/>
    <path d="M256 256 L256 416"/>
  </g>
  <!-- calibration line across the left face, rising like an honest model -->
  <path d="M168 334 L230 290" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <circle cx="168" cy="334" r="12" fill="#fff"/>
  <circle cx="199" cy="312" r="12" fill="#fff"/>
  <circle cx="230" cy="290" r="15" fill="#fff"/>
  <!-- a check on the right face: a decision made -->
  <path d="M290 318 L318 340 L366 282" fill="none" stroke="#141014" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
