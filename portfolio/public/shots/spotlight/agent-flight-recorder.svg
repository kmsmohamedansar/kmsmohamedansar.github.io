<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Agent Flight Recorder timeline</title>
  <desc id="desc">A recorded read, edit and failing test lead to the removed duplicate-payment guard.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1b171e"/><stop offset="1" stop-color="#3b2025"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#d77851" stop-opacity=".42"/><stop offset="1" stop-color="#d77851" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f1d9be" stroke-opacity=".075"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="970" cy="90" r="430" fill="url(#glow)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="76" y="95" fill="#e6c7aa" font-size="18" letter-spacing="5">AGENT FLIGHT RECORDER</text>
    <text x="76" y="152" fill="#f3e4cf" font-size="42" font-weight="700">What changed before it failed?</text>
    <rect x="76" y="208" width="1048" height="492" rx="24" fill="#1e1b22" stroke="#b9957a" stroke-opacity=".55" stroke-width="2"/>
    <text x="110" y="253" fill="#b7a89e" font-size="17">RUN TIMELINE</text>
    <text x="988" y="253" fill="#efac83" font-size="16">FAILED</text>
    <path d="M156 300V599" stroke="#846c66" stroke-width="3"/>
    <circle cx="156" cy="324" r="12" fill="#c4b49d"/>
    <circle cx="156" cy="423" r="12" fill="#efaa7d"/>
    <circle cx="156" cy="584" r="12" fill="#e7776c"/>
    <text x="195" y="332" fill="#f3e4cf" font-size="26">01  READ IMPLEMENTATION</text>
    <text x="195" y="365" fill="#a99e98" font-size="17">payment_service.py</text>
    <text x="195" y="431" fill="#f3e4cf" font-size="26">02  APPLY AGENT EDIT</text>
    <rect x="195" y="451" width="841" height="76" rx="11" fill="#38282c" stroke="#d46b5b" stroke-opacity=".6"/>
    <text x="218" y="481" fill="#ef9789" font-size="19">− if already_paid:</text>
    <text x="218" y="507" fill="#ef9789" font-size="19">−     raise DuplicatePayment("already paid")</text>
    <text x="195" y="592" fill="#f3e4cf" font-size="26">03  RUN REGRESSION TEST</text>
    <text x="195" y="626" fill="#ef9789" font-size="18">duplicate payment accepted</text>
    <text x="76" y="753" fill="#e9c7aa" font-size="18" letter-spacing="2">LOCAL EVIDENCE  /  SUSPECT DIFF  /  EXPLAINED REASON</text>
  </g>
</svg>
