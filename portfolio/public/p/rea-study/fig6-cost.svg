<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Cost per run</title><desc id="d">Mean cost per run, as the command-line tool reports it at API prices, for the three set-ups in development and in the held-out set.</desc><rect width="760" height="330" fill="#fcfcfb"/><text x="24.0" y="28.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Figure 6. Cost per run, as the tool reports it</text><text x="24.0" y="46.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">What each run would cost at API prices. I pay a flat Pro fee, so this measures work, not a bill.</text><rect x="24.0" y="61.0" width="14.0" height="10.0" rx="2" fill="#2a78d6"/><text x="44.0" y="70.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Ordinary tools only</text><rect x="214.0" y="61.0" width="14.0" height="10.0" rx="2" fill="#eb6834"/><text x="234.0" y="70.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">With REA, left alone</text><rect x="404.0" y="61.0" width="14.0" height="10.0" rx="2" fill="#1baf7a"/><text x="424.0" y="70.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">With REA, told to use it</text><line x1="230.0" y1="100.0" x2="230.0" y2="300.0" stroke="#e6e5e0" stroke-width="1"/><text x="230.0" y="316.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">$0.00</text><line x1="304.0" y1="100.0" x2="304.0" y2="300.0" stroke="#e6e5e0" stroke-width="1"/><text x="304.0" y="316.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">$0.05</text><line x1="378.0" y1="100.0" x2="378.0" y2="300.0" stroke="#e6e5e0" stroke-width="1"/><text x="378.0" y="316.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">$0.10</text><line x1="452.0" y1="100.0" x2="452.0" y2="300.0" stroke="