<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How one run works</title><desc id="d">Flow from a program with a known answer, through three set-ups, an agent in an empty folder, a saved record, to scoring against an answer key kept off the study machine.</desc><rect width="760" height="372" fill="#fcfcfb"/><text x="24.0" y="28.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Figure 1. How one run works</text><text x="24.0" y="46.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Every run: one program, one fixed question, one set-up, one agent, one saved record.</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8984"/></marker></defs><rect x="24.0" y="70.0" width="150.0" height="92.0" rx="6" fill="#f1f0ec" stroke="#e6e5e0" stroke-width="1"/><text x="34.0" y="90.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Program</text><text x="34.0" y="108.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Written by me, or open</text><text x="34.0" y="123.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">source. Names stripped.</text><text x="34.0" y="138.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">I know every right</text><text x="34.0" y="153.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">answer.</text><rect x="24.0" y="178.0" width="150.0" height="70.0" rx="6" fill="#f1f0ec" stroke="#e6e5e0" stroke-width="1"/><text x="34.0" y="198.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Question</text><text x="34.0" y="216.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">The same text for</text><text x="34.0" y="231.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">every program and</text><text x="34.0" y="246.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">every set-up.</text><rect x="214.0" y="64.0" width="190.0" height="66.0" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="214.0" y="64.0" width="6.0" height="66.0" rx="0" fill="#2a78d6"/><text x="230.0" y="84.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Ordinary tools only</text><text x="230.0" y="101.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">The Mac's ordinary</text><text x="230.0" y="115.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">command-line tools</text><line x1="174.0" y1="116.0" x2="214.0" y2="97.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><rect x="214.0" y="140.0" width="190.0" height="66.0" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><rect x="214.0" y="140.0" width="6.0" height="66.0" rx="0" fill="#eb6834"/><text x="230.0" y="160.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">With REA, left alone</text><text x="230.0" y="177.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Plus REA (207 tools)</text><text x="230.0" y="191.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">and REA's own</text><text x="230.0" y="205.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">instructions</text><line x1="174.0" y1="116.0" x2="214.0" y2="173.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><rect x="214.0" y="216.0" width="190.0" height="66.0" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/><rect x="214.0" y="216.0" width="6.0" height="66.0" rx="0" fill="#1baf7a"/><text x="230.0" y="236.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">With REA, told to use it</text><text x="230.0" y="253.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Same as above, plus</text><text x="230.0" y="267.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">one sentence: use REA</text><line x1="174.0" y1="116.0" x2="214.0" y2="249.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><rect x="446.0" y="100.0" width="136.0" height="128.0" rx="6" fill="#f1f0ec" stroke="#e6e5e0" stroke-width="1"/><text x="456.0" y="120.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Agent</text><text x="456.0" y="138.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Claude Sonnet 5.5,</text><text x="456.0" y="153.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">default effort.</text><text x="456.0" y="168.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Empty folder holding</text><text x="456.0" y="183.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">only the program.</text><text x="456.0" y="198.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Input closed.</text><line x1="404.0" y1="97.0" x2="446.0" y2="164.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><line x1="404.0" y1="173.0" x2="446.0" y2="164.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><line x1="404.0" y1="249.0" x2="446.0" y2="164.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><rect x="616.0" y="70.0" width="120.0" height="96.0" rx="6" fill="#f1f0ec" stroke="#e6e5e0" stroke-width="1"/><text x="626.0" y="90.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Saved record</text><text x="626.0" y="108.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">The answer, the tools</text><text x="626.0" y="123.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">it called, seconds,</text><text x="626.0" y="138.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">turns, machine,</text><text x="626.0" y="153.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">versions.</text><line x1="582.0" y1="164.0" x2="616.0" y2="118.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><rect x="616.0" y="186.0" width="120.0" height="70.0" rx="6" fill="#f1f0ec" stroke="#e6e5e0" stroke-width="1"/><text x="626.0" y="206.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Scoring</text><text x="626.0" y="224.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">In the cloud, against</text><text x="626.0" y="239.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">the answer key.</text><line x1="676.0" y1="166.0" x2="676.0" y2="186.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><rect x="452.0" y="272.0" width="292.0" height="70.0" rx="6" fill="#ffffff" stroke="#e6e5e0" stroke-width="1"/><text x="464.0" y="292.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">The answer key is never on the study machine.</text><text x="464.0" y="309.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Marks: right, partial or wrong; did it name a real</text><text x="464.0" y="324.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">unknown; did it state something unknowable.</text><text x="464.0" y="339.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Then a person reads the answers behind any gap.</text><line x1="676.0" y1="256.0" x2="676.0" y2="272.0" stroke="#8a8984" stroke-width="1.5" marker-end="url(#a)"/><text x="24.0" y="290.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Repeated 3 times per question in development (135 runs).</text><text x="24.0" y="306.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Held-out: 6 questions, once each (18 runs), at the very end.</text></svg>
