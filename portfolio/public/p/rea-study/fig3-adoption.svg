<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How often the agent chose REA on its own</title><desc id="d">Share of runs, with REA and its instructions available but not mentioned in the prompt, in which the agent called a REA tool.</desc><rect width="760" height="300" fill="#fcfcfb"/><text x="24.0" y="28.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Figure 3. How often the agent chose REA when left alone</text><text x="24.0" y="46.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Runs where it called any REA tool, with REA and its instructions available but not mentioned in the prompt.</text><line x1="270.0" y1="78.0" x2="270.0" y2="244.0" stroke="#e6e5e0" stroke-width="1"/><text x="270.0" y="259.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">0%</text><line x1="352.5" y1="78.0" x2="352.5" y2="244.0" stroke="#e6e5e0" stroke-width="1"/><text x="352.5" y="259.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">25%</text><line x1="435.0" y1="78.0" x2="435.0" y2="244.0" stroke="#e6e5e0" stroke-width="1"/><text x="435.0" y="259.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">50%</text><line x1="517.5" y1="78.0" x2="517.5" y2="244.0" stroke="#e6e5e0" stroke-width="1"/><text x="517.5" y="259.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">75%</text><line x1="600.0" y1="78.0" x2="600.0" y2="244.0" stroke="#e6e5e0" stroke-width="1"/><text x="600.0" y="259.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="400">100%</text><text x="24.0" y="99.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="400">7 easy questions (development)</text><rect x="270.0" y="86.0" width="15.7" height="16.0" rx="3" fill="#eb6834"/><text x="293.7" y="98.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">1 of 21</text><text x="24.0" y="139.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="400">7 harder questions (development)</text><rect x="270.0" y="126.0" width="110.0" height="16.0" rx="3" fill="#eb6834"/><text x="388.0" y="138.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">7 of 21</text><text x="24.0" y="179.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="400">Go build information (development)</text><rect x="270.0" y="166.0" width="330.0" height="16.0" rx="3" fill="#eb6834"/><text x="608.0" y="178.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">3 of 3</text><text x="24.0" y="219.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="400">6 questions (held-out)</text><rect x="270.0" y="206.0" width="0.0" height="16.0" rx="3" fill="#eb6834"/><text x="278.0" y="218.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">0 of 6</text><text x="24.0" y="278.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">When the prompt told it to use REA, it did in every run: 45 of 45 in development, 6 of 6 held-out.</text><text x="24.0" y="296.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">The Go question asked for compiler and library versions, which REA advertises it can read.</text></svg>
